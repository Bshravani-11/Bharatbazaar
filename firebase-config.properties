# ========================================================
# Firebase Realtime Database Configuration
# ========================================================
# How to get your own Firebase Realtime Database URL:
# 1. Go to https://console.firebase.google.com/
# 2. Click "Add Project" (e.g., "BharatBazaar")
# 3. Go to "Build" -> "Realtime Database" -> "Create Database"
# 4. Choose "Test Mode" (allow read/write for testing)
# 5. Copy the Database URL (looks like: https://your-project-id.firebaseio.com)
# 6. Paste it below!
# ========================================================

firebase.enabled=true
firebase.database.url=https://bharatbazaar-btech-default-rtdb.asia-southeast1.firebasedatabase.app
